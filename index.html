<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web-Test</title>
</head>

<body style="background-color: lightblue;">

    <h1>Jakob Kent 5r</h1>

    <h2>Persönliche Daten</h2>

    <p>
        Geburtsdatum: 21.12.2010<br>
        Lieblingsfarbe: Hellblau
    </p>

    <h2>Meine Lieblingsfächer</h2>

    <ol>
        <li>Informatik</li>
        <li>Sport</li>
        <li>Mathematik</li>
    </ol>

    <h2>Meine Hobbys</h2>

    <ul id="liste-hobbys">
    </ul>

    <h2>Freies Bild</h2>

    <figure>
        <img src="img/bild1.jpg.jpg"
             width="400"
             title="Freies Bild"
             alt="Sonnenuntergang am Meer">

        <figcaption>
            Foto von
            <a href="LINK_ZUM_URHEBER" target="_blank">Name des Urhebers</a>,
            Titel:
            <a href="LINK_ZUM_BILD" target="_blank">Bildtitel</a>,
            Lizenz:
            <a href="https://creativecommons.org/licenses/by/4.0/"
               target="_blank">CC BY 4.0</a>
        </figcaption>
    </figure>

    <script>
      const hobbys = ["Gaming", "Fußball", "Musik", "Jakob Kent"];

      const liste = document.getElementById("liste-hobbys");

      hobbys.forEach(h => {
        let li = document.createElement("li");
        li.textContent = h;
        liste.appendChild(li);
      });
    </script>

</body>
</html>
